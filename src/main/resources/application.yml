spring:
  application:
    name: url-shortener-orchestrator
  datasource:
    url: jdbc:h2:file:./data/agenticdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
server:
  port: 8080

app:
  url-shortener:
    base-url: ${APP_BASE_URL:http://localhost:8080}
